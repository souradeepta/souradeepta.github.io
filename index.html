&lt;!-- Bootstrap Core CSS --&gt; &lt;link href=&#34;vendor/bootstrap/css/bootstrap.min.css&#34; rel=&#34;stylesheet&#34;&gt; &lt;!-- Custom Fonts --&gt; &lt;link href=&#34;vendor/fontawesome-free/css/all.min.css&#34; rel=&#34;stylesheet&#34; type=&#34;text/css&#34;&gt; &lt;link href=&#34;https://fonts.googleapis.com/css?family=Source&#43;Sans&#43;Pro:300,400,700,300italic,400italic,700italic&#34; rel=&#34;stylesheet&#34; type=&#34;text/css&#34;&gt; &lt;link href=&#34;vendor/simple-line-icons/css/simple-line-icons.css&#34; rel=&#34;stylesheet&#34;&gt; &lt;!-- Custom CSS --&gt; &lt;link href=&#34;css/stylish-portfolio.min.css&#34; rel=&#34;stylesheet&#34;&gt; &lt;!-- Navigation --&gt; &lt;a class=&#34;menu-toggle rounded&#34; href=&#34;#&#34;&gt; &lt;i class=&#34;fas fa-bars&#34;&gt;&lt;/i&gt; &lt;/a&gt; &lt;nav id=&#34;sidebar-wrapper&#34;&gt; &lt;ul class=&#34;sidebar-nav&#34;&gt; &lt;li class=&#34;sidebar-brand&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#page-top&#34;&gt;Souradeepta Biswas&lt;/a&gt; &lt;/li&gt; &lt;li class=&#34;sidebar-nav-item&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#page-top&#34;&gt;Home&lt;/a&gt; &lt;/li&gt; &lt;li class=&#34;sidebar-nav-item&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#about&#34;&gt;About&lt;/a&gt; &lt;/li&gt; &lt;!-- &lt;li class=&#34;sidebar-nav-item&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#services&#34;&gt;Services&lt;/a&gt; &lt;/li&gt;--&gt; &lt;li class=&#34;sidebar-nav-item&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#portfolio&#34;&gt;Portfolio&lt;/a&gt; &lt;/li&gt; &lt;li class=&#34;sidebar-nav-item&#34;&gt; &lt;a class=&#34;js-scroll-trigger&#34; href=&#34;#footer&#34;&gt;Contact&lt;/a&gt; &lt;/li&gt; &lt;/ul&gt; &lt;/nav&gt; &lt;!-- Header --&gt; &lt;header class=&#34;masthead d-flex&#34;&gt; &lt;div class=&#34;container text-center my-auto&#34;&gt; &lt;h1 class=&#34;mb-1&#34;&gt;Souradeepta Biswas&lt;/h1&gt; &lt;h3 class=&#34;mb-5&#34;&gt; &lt;!-- &lt;em&gt;Currently pursuing masters degree in Computer Science at Syracuse University&lt;/em&gt; --&gt; &lt;/h3&gt; &lt;a class=&#34;btn btn-primary btn-xl js-scroll-trigger&#34; href=&#34;#about&#34;&gt;About me&lt;/a&gt; &lt;/div&gt; &lt;div class=&#34;overlay&#34;&gt;&lt;/div&gt; &lt;/header&gt; &lt;!-- About --&gt; &lt;section class=&#34;content-section bg-light&#34; id=&#34;about&#34;&gt; &lt;div class=&#34;container text-center&#34;&gt; &lt;div class=&#34;row&#34;&gt; &lt;div class=&#34;col-lg-10 mx-auto&#34;&gt; &lt;h2&gt;Grad Life&lt;/h2&gt; &lt;p class=&#34;lead mb-5&#34;&gt;I am currently pursing a Masters degree in Computer Science from &lt;a href=&#34;https://www.syracuse.edu/&#34;&gt;Syracuse University&lt;/a&gt;. &lt;/br&gt;I am specializing in Machine Learning and Data Mining migrated into traditional application space. &lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;row&#34;&gt; &lt;div class=&#34;col-lg-10 mx-auto&#34;&gt; &lt;h2&gt;Corporate Life&lt;/h2&gt; &lt;p class=&#34;lead mb-5&#34;&gt;I have worked for &lt;a href=&#34;https://www.ibm.com/in-en/&#34;&gt;IBM India&lt;/a&gt; close to 4 years. &lt;/br&gt;I have been deployed on various teams while working there. I began working on apps on US Healthcare along clients like Anthem and NASCO. This is where I have gained AHM certification for domain intelligence. &lt;/br&gt;Gradually my primary work on NodeJS and MongoDB where I had to create an application for new ICD10 patient health data aggregation. This had PHI compliant data retrieval and maintenance along with portal for the customer to view health history. &lt;/br&gt;I was also made the Scrum Master for another healthcare project team where I had a great time aidting my team of 20 people. &lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;row&#34;&gt; &lt;div class=&#34;col-lg-10 mx-auto&#34;&gt; &lt;h2&gt;Bachelor Life&lt;/h2&gt; &lt;p class=&#34;lead mb-5&#34;&gt;I have a bachelor of technology degree in Computer Engineering from &lt;a href=&#34;http://www.svnit.ac.in/&#34;&gt;SVNIT&lt;/a&gt; or as other might know as NIT,Surat. &lt;/br&gt;During these formative years of my life I have made great friends who helped nurture my love for code and for Gujarati food! &lt;/br&gt;I was a part of the local &lt;a href=&#34;http://nitsurat.acm.org/&#34;&gt;ACM Chapter&lt;/a&gt; where me and my friends had organized coding competitions, bootcamps, lectures and quizes. &lt;/br&gt;I was also the Design Head for our college festival, AutumnFest which is one of the largest college festival west of India. &lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;row&#34;&gt; &lt;div class=&#34;col-lg-10 mx-auto&#34;&gt; &lt;h2&gt;School Life&lt;/h2&gt; &lt;p class=&#34;lead mb-5&#34;&gt;I have completed the majority of my secondary education from &lt;a href=&#34;https://www.kvongcsurat.org/&#34;&gt;Kendriya Vidayala&lt;/a&gt; at Surat. &lt;/br&gt;The rest was between &lt;a href=&#34;https://www.ryaninternational.org/&#34;&gt;Ryan International School&lt;/a&gt;, Surat and &lt;a href=&#34;https://timpanyschool.in/&#34;&gt;Timpany School&lt;/a&gt;, Vishakhapatnam. &lt;/br&gt;While my primary interest was in Computer Science in secondary school indulging in C&#43;&#43;, my hobby and skill lied in Art where I had garnered many awards to my name. &lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class=&#34;col-lg-10 mx-auto&#34;&gt; &lt;h2&gt;Interests&lt;/h2&gt; &lt;p class=&#34;lead mb-5&#34;&gt;I love to keep up with the latest tech in the news, take photos for my &lt;a href=&#34;https://www.instagram.com/daft_wanderer/&#34;&gt;instagram&lt;/a&gt; feed, travel and to swim. &lt;a class=&#34;btn btn-dark btn-xl js-scroll-trigger&#34; href=&#34;#portfolio&#34;&gt;Projects&lt;/a&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/section&gt; &lt;!-- Services &lt;section class=&#34;content-section bg-primary text-white text-center&#34; id=&#34;services&#34;&gt; &lt;div class=&#34;container&#34;&gt; &lt;div class=&#34;content-section-heading&#34;&gt; &lt;h3 class=&#34;text-secondary mb-0&#34;&gt;Services&lt;/h3&gt; &lt;h2 class=&#34;mb-5&#34;&gt;What We Offer&lt;/h2&gt; &lt;/div&gt; &lt;div class=&#34;row&#34;&gt; &lt;div class=&#34;col-lg-3 col-md-6 mb-5 mb-lg-0&#34;&gt; &lt;span class=&#34;service-icon rounded-circle mx-auto mb-3&#34;&gt; &lt;i class=&#34;icon-screen-smartphone&#34;&gt;&lt;/i&gt; &lt;/span&gt; &lt;h4&gt; &lt;strong&gt;Responsive&lt;/strong&gt; &lt;/h4&gt; &lt;p class=&#34;text-faded mb-0&#34;&gt;Looks great on any screen size!&lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;col-lg-3 col-md-6 mb-5 mb-lg-0&#34;&gt; &lt;span class=&#34;service-icon rounded-circle mx-auto mb-3&#34;&gt; &lt;i class=&#34;icon-pencil&#34;&gt;&lt;/i&gt; &lt;/span&gt; &lt;h4&gt; &lt;strong&gt;Redesigned&lt;/strong&gt; &lt;/h4&gt; &lt;p class=&#34;text-faded mb-0&#34;&gt;Freshly redesigned for Bootstrap 4.&lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;col-lg-3 col-md-6 mb-5 mb-md-0&#34;&gt; &lt;span class=&#34;service-icon rounded-circle mx-auto mb-3&#34;&gt; &lt;i class=&#34;icon-like&#34;&gt;&lt;/i&gt; &lt;/span&gt; &lt;h4&gt; &lt;strong&gt;Favorited&lt;/strong&gt; &lt;/h4&gt; &lt;p class=&#34;text-faded mb-0&#34;&gt;Millions of users &lt;i class=&#34;fas fa-heart&#34;&gt;&lt;/i&gt; Start Bootstrap!&lt;/p&gt; &lt;/div&gt; &lt;div class=&#34;col-lg-3 col-md-6&#34;&gt; &lt;span class=&#34;service-icon rounded-circle mx-auto mb-3&#34;&gt; &lt;i class=&#34;icon-mustache&#34;&gt;&lt;/i&gt; &lt;/span&gt; &lt;h4&gt; &lt;strong&gt;Question&lt;/strong&gt; &lt;/h4&gt; &lt;p class=&#34;text-faded mb-0&#34;&gt;I mustache you a question...&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/section&gt; –&gt; Portfolio Recent Projects Remote Package Dependency Analysis Multi-threaded app developed on C# using WCF for communication between components and the User Interface was built using WPF.">
